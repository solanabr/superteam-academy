# Builds, pushes and deploys the build server. This is the only deploy path:
# deploy.sh just submits this file. The settings in the `gcloud run deploy`
# below are stated in that one command, so none of them is carried over from
# the previous revision. The resources it names (service account, secret, VPC,
# subnet, firewall rule) are created once by setup-gcp.sh.
#
# deploy/__tests__/cloudbuild.test.mjs pins every step and every deploy flag
# to what check-service.mjs verifies. Change the three together, and keep one
# single-quoted scalar per line.
steps:
  # Reject bad substitutions before anything is built. Substitutions reach
  # scripts only as environment variables, never as script text.
  - name: 'node:22-slim'
    id: 'preflight'
    entrypoint: 'node'
    args:
      - 'apps/build-server/deploy/check-service.mjs'
      - 'preflight'
    env:
      - 'PROJECT_ID=${PROJECT_ID}'
      - 'REGION=${_REGION}'
      - 'REPO=${_REPO}'
      - 'SERVICE=${_SERVICE}'
      - 'TAG=${_TAG}'
      - 'ALLOWED_ORIGIN=${_ALLOWED_ORIGIN}'
      - 'MIN_INSTANCES=${_MIN_INSTANCES}'
      - 'MIN_INSTANCES_SIGNOFF=${_MIN_INSTANCES_SIGNOFF}'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'
      - '.'
    dir: 'apps/build-server'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}'

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      # 4 vCPU / 8 GiB: a build copies the pre-built target/ into /tmp, which is
      # memory-backed, before cargo-build-sbf runs.
      - '--cpu'
      - '4'
      - '--memory'
      - '8Gi'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '2'
      # Scale to zero between builds. --cpu-boost shortens the cold start, and
      # --cpu-throttling keeps CPU allocated only while a request is served.
      # A non-zero _MIN_INSTANCES needs _MIN_INSTANCES_SIGNOFF (see preflight).
      # `--min default` clears any service-level minimum.
      - '--min-instances'
      - '${_MIN_INSTANCES}'
      - '--min'
      - 'default'
      - '--max-instances'
      - '2'
      - '--cpu-boost'
      - '--cpu-throttling'
      # Runtime identity. It holds no project-level roles, only read access to
      # the API key secret.
      - '--service-account'
      - 'academy-build-sa@${PROJECT_ID}.iam.gserviceaccount.com'
      # Direct VPC egress: all outbound traffic goes through the VPC, where the
      # firewall rule on the network tag denies it. cargo-build-sbf runs
      # --offline, so a build needs no egress. The names are fixed: the verify
      # step checks the firewall rules of this network for this tag.
      - '--network'
      - 'build-server-vpc'
      - '--subnet'
      - 'build-server-subnet'
      - '--network-tags'
      - 'build-server-no-egress'
      - '--vpc-egress'
      - 'all-traffic'
      # The caller authenticates with X-API-Key, not GCP IAM.
      - '--no-invoker-iam-check'
      # --set-env-vars replaces every literal variable, so a variable that is
      # not listed here (ACADEMY_API_KEY included) is removed before
      # --set-secrets adds the key as a Secret Manager reference.
      # BUILD_TIMEOUT_SECS stays under the web route's 295 s abort and the
      # 300 s request timeout above.
      - '--set-env-vars'
      - 'ALLOWED_ORIGIN=${_ALLOWED_ORIGIN},MAX_CONCURRENT_BUILDS=2,BUILD_TIMEOUT_SECS=240,CACHE_TTL_SECS=1800,LOG_FORMAT=json,RUST_LOG=info'
      - '--set-secrets'
      - 'ACADEMY_API_KEY=academy-build-api-key:latest'

  # Read the service and the firewall rules back, then fail the build if they
  # are not what check-service.mjs expects.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'read-live'
    entrypoint: 'bash'
    args:
      - 'apps/build-server/deploy/read-live.sh'
    env:
      - 'SERVICE=${_SERVICE}'
      - 'REGION=${_REGION}'
      - 'OUT_DIR=/workspace'

  - name: 'node:22-slim'
    id: 'verify'
    entrypoint: 'node'
    args:
      - 'apps/build-server/deploy/check-service.mjs'
      - 'verify'
      - '/workspace/service.json'
      - '/workspace/firewall-rules.json'
    env:
      - 'PROJECT_ID=${PROJECT_ID}'
      - 'REGION=${_REGION}'
      - 'REPO=${_REPO}'
      - 'SERVICE=${_SERVICE}'
      - 'TAG=${_TAG}'
      - 'ALLOWED_ORIGIN=${_ALLOWED_ORIGIN}'
      - 'MIN_INSTANCES=${_MIN_INSTANCES}'
      - 'MIN_INSTANCES_SIGNOFF=${_MIN_INSTANCES_SIGNOFF}'

substitutions:
  _REGION: 'southamerica-east1'
  _REPO: 'academy-images'
  _SERVICE: 'academy-build-server'
  _TAG: 'latest'
  # The web app's origin (CORS). Must be an https origin with no path.
  _ALLOWED_ORIGIN: 'https://www.st.academy'
  _MIN_INSTANCES: '0'
  # Required when _MIN_INSTANCES is not 0: who approved it and when.
  _MIN_INSTANCES_SIGNOFF: ''

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
