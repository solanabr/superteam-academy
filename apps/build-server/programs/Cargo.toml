[package]
name = "academy-program"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
opt-level = "z"

[dependencies]
# Anchor 1.1.2 re-exports solana-program — no direct dep needed
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }

# Serialization (Anchor 1.x uses borsh 1.5 internally)
borsh = "1.5.7"
