name: Claude Code Review

on:
  pull_request:
    # Every PR is reviewed on open / ready / reopen. Additionally — and ONLY for PRs
    # carrying `needs-gate` — re-review on every push (`synchronize`) and when the
    # label is first applied (`labeled`). This closes the #710 race: the orchestrator
    # pushes hardening commits after the review has started, so the review reported on
    # a head that no longer existed (and 3 of 5 stale reviews missed the security-
    # relevant commit). Scoping the push re-review to needs-gate keeps the OAuth-token
    # cost off every ordinary PR push; the `if:` below enforces the scope, and the
    # concurrency group cancels an in-flight review the moment a newer head arrives so
    # a stale verdict can never post.
    types: [opened, ready_for_review, reopened, synchronize, labeled]

# One review per PR at a time; a newer head cancels the older review in flight (the
# mechanical core of the #710 fix — the pre-fix head's review is superseded, never
# posted as if current). Keyed on PR number so PRs don't cancel each other.
concurrency:
  group: claude-code-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # opened/ready/reopened review any PR (unchanged). synchronize + labeled fire for
    # every PR but are admitted here only for needs-gate, so a fresh-head review is
    # guaranteed both when the PR is queued (label added) and on each subsequent push,
    # without re-reviewing every push of every PR.
    if: >-
      github.event.action == 'opened' ||
      github.event.action == 'ready_for_review' ||
      github.event.action == 'reopened' ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'needs-gate')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'needs-gate')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the review summary + inline comments on the PR
      issues: write # PR conversation comments use the issues-comments API
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@b76a0776ae74036e77cd11018083743453d7ad35 # v1.0.179
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without this, agent mode runs the review but never publishes it
          # (permission_denials_count + "No buffered inline comments"). Forcing tag
          # mode posts the review as a tracking comment — the same mechanism the
          # @claude path uses. Supported on pull_request opened/ready_for_review/reopened.
          track_progress: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Academy bar: this is an on-chain education platform where correctness and
          # security are financial-trust-grade (on-chain XP mints, soulbound credentials,
          # RLS-protected user data). Hold a high bar; correctness/security over style.
          prompt: |
            Run /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            with these Superteam Academy priorities layered on top.

            First read CLAUDE.md and docs/TASK-CODES.md for conventions and the task-code system.
            If the PR body says "Closes #N", verify the diff actually meets that issue's "Done when".

            Scrutinize these hardest — the project's NEVER-ship-broken areas:
            - RLS / supabase/schema.sql: no policy that lets a user write rows the platform later
              trusts (user_progress, enrollments, user_xp, achievements). Trusted writes are
              service-role-only. Flag any forgeable progress/XP path.
            - On-chain (onchain-academy/**): checked arithmetic only (no raw +,-,*), no
              unwrap()/expect()/panic!, stored canonical PDA bumps, validated account
              owner/signer/PDA, pinned CPI target program IDs.
            - Secrets: nothing server-only (ADMIN_SECRET, service-role key, RPC/Helius keys)
              reaching a client bundle or a NEXT_PUBLIC_ var.
            - Trust boundaries: server is authoritative — no client-trusted validation
              (challenge "passed", XP amounts, completion flags) and no solutions/hidden tests
              shipped in a client payload.

            Output: lead with BLOCKING findings (correctness / security / does-not-meet-Done-when),
            then non-blocking suggestions. Be decisive, cite file:line, don't pad with nits.
            This review is ADVISORY — CI is the hard gate, and a human signs off on anything
            touching RLS, on-chain, secrets, or mainnet (it must never imply a self-merge of those).

