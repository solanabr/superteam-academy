name: Content release

# Opens, or updates, the one PR that moves apps/web/content.lock to
# academy-courses main (or to the `sha` given on a manual run) with the
# recompiled bundle. A human reviews and merges it, then runs Deploy for any
# course the PR flags (docs/ADMIN.md, "Publishing new content").
#
# Three jobs so the App credentials never share a runner with code that reads
# academy-courses content: `build` compiles with a read-only GITHUB_TOKEN and
# hands the bundle over as an artifact, and `publish` mints the App token and
# runs only git and gh, no repo code. The App token is needed because a PR
# opened with GITHUB_TOKEN never triggers CI.
#
# bot/content-release belongs to this workflow. It is rebuilt from main and
# force-pushed whenever the bundle it should carry changes; never commit to it.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: academy-courses commit to release (full 40-hex sha, on main). Leave empty for main HEAD.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: content-release
  cancel-in-progress: false

env:
  CONTENT_REPO: solanabr/academy-courses
  RELEASE_BRANCH: bot/content-release
  NODE_VERSION: "20"

jobs:
  resolve:
    name: Compare content.lock with academy-courses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.target.outputs.base }}
      target: ${{ steps.target.outputs.target }}
      due: ${{ steps.target.outputs.due }}
    steps:
      - name: Resolve the release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          # Checked here, before the compile, but never handed to a job that
          # reads content.
          HAS_APP: ${{ secrets.CONTENT_RELEASE_APP_ID != '' && secrets.CONTENT_RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          # Both later jobs check out this exact main commit.
          base=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          locked=$(gh api "repos/$GITHUB_REPOSITORY/contents/apps/web/content.lock?ref=$base" --jq .content | base64 -d | jq -r .sha)
          if [ -n "$INPUT_SHA" ]; then
            if ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::sha must be a full 40-character lowercase commit hash."
              exit 1
            fi
            # sha...main is "ahead" or "identical" only when sha is on main.
            reach=$(gh api "repos/$CONTENT_REPO/compare/$INPUT_SHA...main" --jq .status) || reach=missing
            if [ "$reach" != ahead ] && [ "$reach" != identical ]; then
              echo "::error::$INPUT_SHA is not a commit on $CONTENT_REPO main."
              exit 1
            fi
            target=$INPUT_SHA
          else
            target=$(gh api "repos/$CONTENT_REPO/commits/main" --jq .sha)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [ "$target" = "$locked" ]; then
            echo "content.lock already pins $target."
            echo "due=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HAS_APP" != true ]; then
            echo "::error::Missing secrets CONTENT_RELEASE_APP_ID and CONTENT_RELEASE_APP_PRIVATE_KEY (one-time setup: docs/ADMIN.md)."
            exit 1
          fi
          # academy-courses CI (content-lint, executor and quiz gates) is what
          # certifies a tree; the compile here does not re-run it. Same rule as
          # the admin pin card: only a green commit ships.
          checks=$(gh api "repos/$CONTENT_REPO/commits/$target/check-runs?filter=latest&per_page=100" --jq '
            if (.check_runs | length) == 0 or .total_count > (.check_runs | length) then "unknown"
            elif any(.check_runs[]; .conclusion != null and .conclusion != "success") then "failure"
            elif any(.check_runs[]; .conclusion == null) then "pending"
            else "success" end')
          case "$checks" in
            success) ;;
            pending)
              echo "academy-courses CI is still running on $target; the next run picks it up."
              echo "due=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::academy-courses CI is $checks on $target; not releasing it."
              exit 1
              ;;
          esac
          echo "content.lock pins $locked; releasing $target."
          echo "due=true" >> "$GITHUB_OUTPUT"

  build:
    name: Compile the bundle at the target
    needs: resolve
    if: needs.resolve.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10, version read from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: pnpm install --frozen-lockfile

      - name: Compile
        env:
          # Read-only; only raises the GitHub rate limit for the tarball fetch.
          GITHUB_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.resolve.outputs.target }}
        run: |
          cp -R apps/web/src/content/generated "$RUNNER_TEMP/before"
          jq --arg sha "$TARGET" '.sha = $sha' apps/web/content.lock > "$RUNNER_TEMP/content.lock"
          mv "$RUNNER_TEMP/content.lock" apps/web/content.lock
          pnpm --filter web compile-content

      - name: Write the PR body
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.resolve.outputs.target }}
        run: |
          locked=$(jq -r .sha "$RUNNER_TEMP/before/meta.json")
          gh api "repos/$CONTENT_REPO/compare/$locked...$TARGET" > "$RUNNER_TEMP/compare.json"
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          pnpm --filter web exec tsx scripts/content-release-body.ts \
            --before "$RUNNER_TEMP/before" \
            --compare "$RUNNER_TEMP/compare.json" > "$release/body.md"
          cp apps/web/content.lock "$release/content.lock"
          cp -R apps/web/src/content/generated "$release/generated"
          cat "$release/body.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: content-release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Push the release branch and open or update the PR
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: content-release
          path: ${{ runner.temp }}/release

      - name: Mint the App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CONTENT_RELEASE_APP_ID }}
          private-key: ${{ secrets.CONTENT_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Push and open or update the PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          TARGET: ${{ needs.resolve.outputs.target }}
        run: |
          release="$RUNNER_TEMP/release"
          paths=(apps/web/content.lock apps/web/src/content/generated)
          cp "$release/content.lock" apps/web/content.lock
          rm -rf apps/web/src/content/generated
          cp -R "$release/generated" apps/web/src/content/generated
          git add -A "${paths[@]}"
          if git diff --cached --quiet; then
            echo "main already ships this bundle."
            exit 0
          fi

          gh auth setup-git
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$RELEASE_BRANCH&state=open" --jq '.[0].number // empty')
          if [ -n "$pr" ] &&
            git fetch --quiet --depth=1 origin "$RELEASE_BRANCH" &&
            git diff --cached --quiet FETCH_HEAD -- "${paths[@]}"; then
            echo "#$pr already carries this bundle."
            exit 0
          fi

          title="chore(content): release academy-courses ${TARGET:0:7}"
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)
          git -c user.name="$bot" -c user.email="$bot_id+$bot@users.noreply.github.com" \
            commit --quiet -m "$title"
          git push --force origin "HEAD:refs/heads/$RELEASE_BRANCH"

          if [ -n "$pr" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" \
              -f title="$title" -F body=@"$release/body.md" --silent
            echo "Updated #$pr."
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f title="$title" -f head="$RELEASE_BRANCH" -f base=main \
              -F body=@"$release/body.md" --jq '"Opened #\(.number)."'
          fi
