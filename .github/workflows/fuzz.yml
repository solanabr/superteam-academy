name: Fuzz (litesvm)

# P2-1 — real program-level fuzzing of the on-chain `onchain_academy` program.
# This is a SCHEDULED, non-blocking job: it is intentionally NOT wired to
# `pull_request`, so it never gates PR merges. It runs nightly (and on demand)
# for 10+ minutes against the REAL compiled `.so`, fails the job if the fuzzer
# finds a crash, and uploads the crash file for triage.
#
# The harness (onchain-academy/tests/fuzz) drives litesvm 0.12 — the agave 3.x
# runtime line the differential suite already uses. It replaced Trident in
# 09-2026: Trident 0.12 embeds solana-sbpf 0.11 (agave 2.x), which cannot
# execute the platform-tools v1.54 Pinocchio binary at all ("unsupported BPF
# instruction" on every instruction), so from 2026-07-22 the nightly was red
# with zero coverage. A preflight smoke now runs one `initialize` and hard-fails
# with its own exit code if the program does not execute, so that failure mode
# can never masquerade as fuzzing again.
#
# Exit-code contract (fuzz binary): 0 = all iterations clean, 98 = preflight
# smoke failed (harness/runtime broken, no fuzzing happened), 99 = crash
# (violated invariant or unexpected program error). The binary self-stops at
# FUZZ_MAX_SECONDS, so a clean run always exits 0 with a `coverage:` line; the
# `timeout` wrapper firing (124, or 143 = 128+SIGTERM) means an iteration hung
# and is a failure, not a full window. A failing run files/nudges a tracking
# issue so a red nightly cannot go unnoticed again.

on:
  schedule:
    # 03:17 UTC nightly (off the hour to avoid the cron stampede).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Max fuzzing wall-clock seconds (>= 600 to honor the 10-min floor)"
        required: false
        default: "900"
      iterations:
        description: "Iteration count (upper bound; timeout usually hits first)"
        required: false
        default: "1000000"
      seed:
        description: "Master seed (leave blank for a time-based seed, printed in the log)"
        required: false
        default: ""

# Don't pile up nightly runs on top of each other.
concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (onchain_academy · litesvm)
    runs-on: ubuntu-latest
    # Job ceiling above the fuzz window so build + the run both fit.
    timeout-minutes: 40
    # Scoped here rather than at workflow level: only this job files the alarm.
    permissions:
      contents: read
      issues: write
    env:
      SOLANA_VERSION: "3.1.10"
      # 600s floor enforced below regardless of the dispatch input.
      FUZZ_DURATION: ${{ github.event.inputs.duration_seconds || '900' }}
      FUZZ_ITERATIONS: ${{ github.event.inputs.iterations || '1000000' }}
      FUZZ_SEED: ${{ github.event.inputs.seed || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable channel, resolved 2026-06-30

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The fuzz crate path-depends on the differential crate; cache both
          # plus the program workspace (for the pinocchio build).
          workspaces: |
            onchain-academy
            onchain-academy/tests/differential
            onchain-academy/tests/fuzz

      # Cache the Solana CLI install + the SBF platform-tools (v1.54) so
      # cargo-build-sbf doesn't re-download them each nightly run.
      - name: Cache Solana CLI + platform-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}-tools-v1.54

      - name: Install Solana CLI
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            curl -sSfL "https://release.anza.xyz/v${SOLANA_VERSION}/install" -o /tmp/solana-install.sh
            sh /tmp/solana-install.sh
          fi
          BIN="$HOME/.local/share/solana/install/active_release/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/cargo-build-sbf" --version

      # The harness loads target/deploy/onchain_academy_pinocchio.so, so the
      # program must be compiled to SBF first. Token-2022, the Associated-Token
      # program and the system program are litesvm built-ins.
      - name: Build program (.so for the fuzz SVM)
        run: cargo build-sbf --manifest-path programs/onchain-academy-pinocchio/Cargo.toml --tools-version v1.54
        working-directory: onchain-academy

      - name: Build fuzz target
        run: cargo build --release --bin fuzz
        working-directory: onchain-academy/tests/fuzz

      # Exits 98 if the program cannot execute — the check that would have
      # caught seven weeks of "1M iterations, 0 successes" on day one.
      - name: Preflight smoke + harness tests
        run: cargo test --release
        working-directory: onchain-academy/tests/fuzz

      - name: Run fuzzer (>= 10 min)
        working-directory: onchain-academy/tests/fuzz
        env:
          FUZZ_CRASH_DIR: crashes
        run: |
          set +e
          DURATION="${FUZZ_DURATION}"
          # Enforce the 10-minute floor the issue requires.
          if [ "${DURATION}" -lt 600 ]; then
            echo "duration ${DURATION}s below the 600s floor; clamping to 600s"
            DURATION=600
          fi
          echo "Fuzzing for up to ${DURATION}s (iteration ceiling ${FUZZ_ITERATIONS})..."
          # The binary also stops itself at the budget so it can print its
          # coverage summary; `timeout` is the hard backstop.
          export FUZZ_MAX_SECONDS="${DURATION}"
          # SIGTERM at DURATION+60; SIGKILL 30s later if it ignores TERM.
          # Tee'd so the completion check below can read the summary back.
          timeout --signal=TERM --kill-after=30s "$((DURATION + 60))s" \
            cargo run --release --bin fuzz -- "${FUZZ_ITERATIONS}" 2>&1 | tee fuzz.log
          CODE="${PIPESTATUS[0]}"
          echo "fuzzer exit code: ${CODE}"

          fail() {
            echo "FUZZ_FAILURE=$1" >> "$GITHUB_ENV"
            echo "::error::$1"
            exit 1
          }

          case "${CODE}" in
            0)
              # A run that stopped early — killed, OOM, output truncated — can
              # still exit 0 through the pipe. The coverage summary is the only
              # proof the driver reached its end.
              if ! grep -q '^coverage:' fuzz.log; then
                fail "Fuzzer exited 0 without printing a coverage line — the run did not complete."
              fi
              echo "Fuzzing completed with no crashes."
              ;;
            124|143)
              # 124 = GNU timeout reached; 143 = 128+SIGTERM. The binary stops
              # itself at FUZZ_MAX_SECONDS, so `timeout` firing DURATION+60s
              # later means an iteration hung — never a clean window.
              fail "Fuzzer hung: killed by timeout ${DURATION}s+60s after the budget (exit ${CODE}). No coverage line."
              ;;
            98)
              fail "Preflight smoke failed — the program never executed, so nothing was fuzzed."
              ;;
            99)
              fail "Fuzzer reported a crash (exit 99). See the log + the crash artifact."
              ;;
            *)
              fail "Fuzzer exited unexpectedly with code ${CODE}."
              ;;
          esac

      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashes
          path: onchain-academy/tests/fuzz/crashes/
          if-no-files-found: ignore
          retention-days: 14

      # A red nightly nobody sees is a nightly that does not exist — Trident was
      # red for seven weeks. Same pattern as bcb-561-reverify-alarm.yml: the
      # preinstalled `gh` CLI against the default token, no action to SHA-pin.
      - name: File or nudge the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          # Stable marker — the idempotency key. Never change it without
          # closing the issue it currently tracks.
          TITLE: "[alarm] nightly fuzz (litesvm) is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ env.FUZZ_FAILURE || 'The job failed before the fuzzer ran (build, preflight tests or setup).' }}
        run: |
          set -euo pipefail

          # printf rather than an indented heredoc: YAML block-scalar indentation
          # would otherwise land in the issue body as markdown code blocks.
          summary="$(printf 'Run: %s\nReason: %s\n\nExit-code contract: **98** preflight smoke failed (the program never executed — nothing was fuzzed), **99** the fuzzer found a crash (invariant violation or unexpected program error; the fuzz-crashes artifact carries the seed and the instruction sequence), **124/143** the fuzzer hung past its budget, anything else an unexpected driver failure.' "$RUN_URL" "$REASON")"

          # Client-side title match, not --search: the search index is
          # eventually consistent and idempotency must not depend on it.
          existing="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all --limit 1000 \
            --json number,state,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0] // empty")"

          if [ -n "$existing" ]; then
            num="$(echo "$existing" | jq -r '.number')"
            state="$(echo "$existing" | jq -r '.state | ascii_downcase')"
            if [ "$state" != "open" ]; then
              echo "Tracking issue #$num is closed — reopening for a fresh failure."
              gh issue reopen "$num" --repo "$GITHUB_REPOSITORY"
            fi
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" \
              --body "$(printf 'Nightly fuzz failed again.\n\n%s' "$summary")"
            echo "Nudged #$num."
            exit 0
          fi

          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
            --body "$(printf 'The nightly fuzz job (.github/workflows/fuzz.yml) failed.\n\n%s\n\nClose this issue once the nightly is green again; it is reopened and nudged on the next failure.' "$summary")"
          echo "Filed the tracking issue."
